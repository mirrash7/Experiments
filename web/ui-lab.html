<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BREAKLIGHT UI Lab</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0620; }
    canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #lab { position: fixed; left: 8px; bottom: 8px; z-index: 200; width: 214px; max-height: calc(100vh - 16px); overflow: auto; padding: 8px 10px; border-radius: 8px;
      background: rgba(10, 8, 20, 0.88); color: #ddd; font: 11px/1.35 system-ui, sans-serif; border: 1px solid #333; }
    #lab.min > :not(h4:first-child) { display: none; }
    #lab h4 { margin: 6px 0 3px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #ffb547; cursor: default; }
    #lab h4:first-child { margin-top: 0; cursor: pointer; }
    #lab .row { display: flex; flex-wrap: wrap; gap: 3px; }
    #lab button { background: #262236; color: #eee; border: 1px solid #443d5c; border-radius: 4px; padding: 2px 6px; font: inherit; cursor: pointer; }
    #lab button:hover { border-color: #ffb547; }
    #lab button.on { background: #ffb547; color: #000; }
    #lab pre { margin: 4px 0 0; white-space: pre-wrap; color: #9fa; font-size: 10px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="lab"></div>
  <script type="module" src="/src/game/ui/lab.js"></script>
</body>
</html>
