<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Character Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fc6e8; overflow: hidden; font-family: system-ui, sans-serif; }
  /* canvas fills the layout viewport via CSS; the renderer sizes from its client box (render/pipeline.js) */
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 5px; z-index: 2; pointer-events: none; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; pointer-events: auto; max-width: 900px; }
  #ui .lbl { font-size: 11px; font-weight: 700; color: #223; text-transform: uppercase; letter-spacing: .5px; min-width: 44px; }
  #ui button, #ui select, #ui label { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid #335; background: #fff; }
  #ui button.on { background: #335; color: #fff; }
  #ui label input[type=range] { vertical-align: middle; width: 110px; }
  #perf { position: fixed; right: 8px; bottom: 8px; z-index: 2; background: #0b1020d9; color: #e9eefc; font: 11px/1.45 ui-monospace, Menlo, monospace;
    padding: 8px 10px; border-radius: 8px; min-width: 210px; white-space: pre; pointer-events: none; }
  #perf b { color: #ffd23f; font-weight: 600; }
  #perf .bad { color: #ff7675; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <div class="row" id="poseRow"><span class="lbl">Pose</span>
    <button data-mode="anim">Animate</button>
  </div>
  <div class="row"><span class="lbl">View</span>
    <button data-view="front">Front</button>
    <button data-view="side">Side</button>
    <button data-view="back">Back</button>
    <button data-view="q34">3/4</button>
    <button data-view="face">Face</button>
    <button data-view="far">Game cam</button>
    <button id="turntable">Turntable 30s</button>
  </div>
  <div class="row"><span class="lbl">Debug</span>
    <label><input id="outline" type="checkbox" checked /> outline</label>
    <label><input id="wire" type="checkbox" /> wireframe</label>
    <label>weights <select id="heat"><option value="">off</option><option value="*">dominant bone</option></select></label>
    <label><input id="joints" type="checkbox" /> joints</label>
    <label><input id="blob" type="checkbox" checked /> contact blob</label>
    <label>key light <input id="keyYaw" type="range" min="-180" max="180" step="1" value="35" /> <span id="keyYawVal">35°</span></label>
  </div>
  <div class="row"><span class="lbl">Face</span>
    <select id="expr"></select>
    <label>mouth <input id="mouth" type="range" min="0" max="1" step="0.01" value="0" /></label>
    <label>blink <input id="blink" type="range" min="0" max="1" step="0.01" value="0" /></label>
  </div>
</div>
<div id="perf">perf</div>
<script type="module" src="./character-preview.js"></script>
</body>
</html>
